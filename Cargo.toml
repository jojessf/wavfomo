[package]
name = "wavfomo"
version = "0.1.3"
edition = "2024"
# Proprietary; see the README license section. The SPDX `LicenseRef-` form marks
# this as a non-OSI license so cargo-about / cargo-deny don't flag the root crate
# as "unknown" while auditing the dependency tree.
license = "LicenseRef-proprietary"
# Proprietary app — never publish to crates.io. Also lets cargo-about/-deny skip
# this crate when auditing third-party licenses (see `private` in about.toml).
publish = false

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
realfft = "3.5.0"
rodio = "0.22.2"
rustfft = "6.4.1"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
