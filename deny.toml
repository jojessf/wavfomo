# cargo-deny — dependency license policy gate.
#   Run:  cargo deny check licenses   (or: make deny)
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# Keep the `allow` set below in sync with about.toml's `accepted` list — one
# generates the attribution file, the other enforces the policy.

[licenses]
# A crate whose license isn't listed here fails the check. All permissive or
# weak-copyleft; a strong-copyleft (GPL/AGPL) crate sneaking in transitively
# will break CI instead of silently shipping.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",          # symphonia (via rodio); weak, file-level copyleft
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
]
# Fuzzy-match confidence for identifying a license from its text (0.0–1.0).
confidence-threshold = 0.8
# The allow-list carries headroom for licenses not yet in the tree; don't warn
# about entries that happen to be currently unused.
unused-allowed-license = "allow"
# Skip this crate itself: proprietary and `publish = false`, so not third-party.
private = { ignore = true }
